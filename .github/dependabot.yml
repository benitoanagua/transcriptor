version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      avalonia:
        patterns:
          - "Avalonia"
          - "Avalonia.*"
      xunit:
        patterns:
          - "xunit"
          - "xunit.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
