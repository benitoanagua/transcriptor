name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Build recorder
        run: dotnet build rec/Rec.csproj --configuration Release

      - name: Build transcription and setup tools
        shell: pwsh
        run: |
          dotnet build transcription/Transcriptor.Transcription.csproj --configuration Release
          dotnet build setup/Transcriptor.Setup.csproj --configuration Release

      - name: Build desktop application
        run: dotnet build desktop-avalonia/Transcriptor.Desktop.csproj --configuration Release

      - name: Run automated tests
        run: dotnet test tests/Transcriptor.Tests/Transcriptor.Tests.csproj --configuration Release

      - name: Run Windows-only test suite
        run: dotnet test tests/Transcriptor.Tests.Windows/Transcriptor.Tests.Windows.csproj --configuration Release

      - name: Publish self-contained Avalonia desktop application
        run: >-
          dotnet publish desktop-avalonia/Transcriptor.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package

      - name: Smoke test Avalonia desktop startup
        shell: pwsh
        run: |
          $app = Resolve-Path "artifacts/package/Transcriptor.Desktop.exe"
          $process = Start-Process -FilePath $app.Path -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Avalonia desktop startup smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Publish self-contained setup utility
        run: >-
          dotnet publish setup/Transcriptor.Setup.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package/tools/setup

      - name: Publish self-contained recorder CLI
        run: >-
          dotnet publish rec/Rec.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package/tools/rec

      - name: Generate direct and transitive dependency inventories
        shell: pwsh
        run: |
          $inventory = "artifacts/package/dependency-inventory"
          New-Item -ItemType Directory -Force -Path $inventory | Out-Null

          $projects = @(
            @{ Path = "desktop-avalonia/Transcriptor.Desktop.csproj"; Name = "desktop" },
            @{ Path = "rec/Rec.csproj"; Name = "recorder" },
            @{ Path = "transcription/Transcriptor.Transcription.csproj"; Name = "transcription" }
          )
          foreach ($project in $projects) {
            $destination = Join-Path $inventory "$($project.Name).packages.json"
            dotnet list $project.Path package --include-transitive --format json |
              Set-Content -Encoding utf8 $destination
            if ($LASTEXITCODE -ne 0) {
              throw "Could not generate dependency inventory for $($project.Path)"
            }
            Get-Content -Raw $destination | ConvertFrom-Json | Out-Null
          }

          $inventoryFiles = @(Get-ChildItem $inventory -File -Filter "*.packages.json")
          if ($inventoryFiles.Count -ne $projects.Count) {
            throw "Dependency inventory is incomplete."
          }

      - name: Validate package and create archives
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/package/README.md
          Copy-Item docs artifacts/package/docs -Recurse
          Copy-Item LICENSE artifacts/package/LICENSE

          $requiredFiles = @(
            "Transcriptor.Desktop.exe",
            "tools/setup/transcriptor-setup.exe",
            "tools/rec/rec.exe",
            "README.md",
            "docs/SECURITY.md",
            "LICENSE",
            "docs/THIRD-PARTY-NOTICES.md",
            "dependency-inventory/desktop.packages.json",
            "dependency-inventory/recorder.packages.json",
            "dependency-inventory/transcription.packages.json"
          )
          foreach ($relativePath in $requiredFiles) {
            $candidate = Join-Path "artifacts/package" $relativePath
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "Required release file is missing: $candidate"
            }
          }
          $packageFiles = @(Get-ChildItem "artifacts/package" -File -Recurse)
          if ($packageFiles.Count -eq 0) {
            throw "The release package is empty."
          }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $archive = "artifacts/Transcriptor-win-x64.zip"
          Compress-Archive -Path "artifacts/package/*" -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "The standard release archive was not created."
          }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  Transcriptor-win-x64.zip" | Set-Content -Encoding ascii "artifacts/Transcriptor-win-x64.zip.sha256"

          # Inspect ZIP entries and independently verify each SHA-256 sidecar.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Test-ReleaseArchive {
            param(
              [Parameter(Mandatory=$true)][string]$ArchivePath,
              [Parameter(Mandatory=$true)][string]$ChecksumPath,
              [Parameter(Mandatory=$true)][string[]]$RequiredEntries
            )

            $actualHash = (Get-FileHash -LiteralPath $ArchivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumLine = (Get-Content -LiteralPath $ChecksumPath -Raw).Trim()
            $checksumParts = $checksumLine -split '  ', 2
            if ($checksumParts.Count -ne 2 -or $checksumParts[0] -notmatch '^[0-9a-fA-F]{64}$') {
              throw "Invalid SHA-256 sidecar format: $ChecksumPath"
            }
            if ($checksumParts[1] -ne [IO.Path]::GetFileName($ArchivePath) -or $checksumParts[0].ToLowerInvariant() -ne $actualHash) {
              throw "SHA-256 sidecar does not match $ArchivePath"
            }

            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $ArchivePath).Path)
            try {
              $entries = @{}
              foreach ($entry in $zip.Entries) {
                $entries[$entry.FullName.Replace('\', '/')] = $true
              }
              foreach ($required in $RequiredEntries) {
                if (-not $entries.ContainsKey($required)) {
                  throw "Archive $ArchivePath is missing required entry: $required"
                }
              }
            }
            finally {
              $zip.Dispose()
            }
          }

          Test-ReleaseArchive -ArchivePath $archive -ChecksumPath "artifacts/Transcriptor-win-x64.zip.sha256" -RequiredEntries $requiredFiles

          # ------------------------------------------------------------------
          # Guardia anti-fugas del head INSEGURO de desarrollo: el ZIP de la
          # release no debe contener assemblies de desktop-dev, su biblioteca
          # de muestra ni ninguna referencia al protector inseguro.
          # ------------------------------------------------------------------
          $forbiddenEntryPattern = '(^|/)Transcriptor\.Dev(\.|$)|(^|/)DevSample|(^|/)dev-secret'
          $forbiddenStrings = @(
            @{ Text = "InsecureDevSecretProtector"; Reason = "protector INSEGURO de desarrollo" },
            @{ Text = "DevSampleLibrary"; Reason = "biblioteca INSEGURA de desarrollo" },
            @{ Text = "ReversibleTestSecretProtector"; Reason = "protector de pruebas invertible" }
          )
          $needles = foreach ($f in $forbiddenStrings) {
            [pscustomobject]@{
              Bytes = [Text.Encoding]::Unicode.GetBytes([string]$f.Text)
              Reason = $f.Reason
            }
            [pscustomobject]@{
              Bytes = [Text.Encoding]::ASCII.GetBytes([string]$f.Text)
              Reason = $f.Reason
            }
          }
          function Test-ForbiddenBytes {
            param([byte[]]$Data, [byte[]]$Needle)
            if ($Needle.Length -eq 0 -or $Needle.Length -gt $Data.Length) {
              return $false
            }
            $lastStart = $Data.Length - $Needle.Length
            $start = 0
            while ($start -le $lastStart) {
              $candidate = [Array]::IndexOf($Data, $Needle[0], $start)
              if ($candidate -lt 0 -or $candidate -gt $lastStart) { return $false }
              $isMatch = $true
              for ($offset = 1; $offset -lt $Needle.Length; $offset++) {
                if ($Data[$candidate + $offset] -ne $Needle[$offset]) {
                  $isMatch = $false
                  break
                }
              }
              if ($isMatch) { return $true }
              $start = $candidate + 1
            }
            return $false
          }
          $guardZip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archive).Path)
          try {
            foreach ($entry in $guardZip.Entries) {
              $entryPath = $entry.FullName.Replace('\', '/')
              if ($entryPath -match $forbiddenEntryPattern) {
                throw "El paquete de release contiene un ensamblado de desarrollo: $entryPath"
              }
              if ($entryPath -notmatch '\.(dll|exe|json|config)$') { continue }
              $stream = $entry.Open()
              try {
                $buffer = New-Object byte[] $entry.Length
                $read = 0
                while ($read -lt $buffer.Length) {
                  $chunk = $stream.Read($buffer, $read, $buffer.Length - $read)
                  if ($chunk -le 0) { break }
                  $read += $chunk
                }
              } finally { $stream.Dispose() }
              foreach ($needle in $needles) {
                if (Test-ForbiddenBytes $buffer $needle.Bytes) {
                  throw "El paquete de release contiene $($needle.Reason) dentro de: $entryPath"
                }
              }
            }
          } finally { $guardZip.Dispose() }

      - name: Upload validation packages (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Transcriptor-windows-validation
          path: |
            artifacts/Transcriptor-win-x64.zip
            artifacts/Transcriptor-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Transcriptor ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/Transcriptor-win-x64.zip
            artifacts/Transcriptor-win-x64.zip.sha256
