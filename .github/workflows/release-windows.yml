name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Build recorder
        run: dotnet build rec/Rec.csproj --configuration Release

      - name: Build transcription and setup tools
        shell: pwsh
        run: |
          dotnet build transcription/Transcriptor.Transcription.csproj --configuration Release
          dotnet build setup/Transcriptor.Setup.csproj --configuration Release

      - name: Build desktop application
        run: dotnet build desktop-avalonia/Transcriptor.Desktop.csproj --configuration Release

      - name: Run automated tests
        run: dotnet test tests/Transcriptor.Tests/Transcriptor.Tests.csproj --configuration Release

      - name: Run Windows-only test suite
        run: dotnet test tests/Transcriptor.Tests.Windows/Transcriptor.Tests.Windows.csproj --configuration Release

      - name: Publish self-contained Avalonia desktop application
        run: >-
          dotnet publish desktop-avalonia/Transcriptor.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package

      - name: Smoke test Avalonia desktop startup
        shell: pwsh
        run: |
          $app = Resolve-Path "artifacts/package/Transcriptor.Desktop.exe"
          $process = Start-Process -FilePath $app.Path -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Avalonia desktop startup smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Publish self-contained setup utility
        run: >-
          dotnet publish setup/Transcriptor.Setup.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package/tools/setup

      - name: Publish self-contained recorder CLI
        run: >-
          dotnet publish rec/Rec.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package/tools/rec

      - name: Generate direct and transitive dependency inventories
        run: dotnet run --project tools/Transcriptor.Tools -- inventory
      - name: Smoke test Avalonia desktop startup
        run: dotnet run --project tools/Transcriptor.Tools -- smoke artifacts/package/Transcriptor.Desktop.exe

      - name: Validate package and create archives
        run: dotnet run --project tools/Transcriptor.Tools -- package

      - name: Upload validation packages (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Transcriptor-windows-validation
          path: |
            artifacts/Transcriptor-win-x64.zip
            artifacts/Transcriptor-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Transcriptor ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/Transcriptor-win-x64.zip
            artifacts/Transcriptor-win-x64.zip.sha256
