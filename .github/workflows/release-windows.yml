name: Windows Release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    name: Build and publish Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build recorder
        run: dotnet build rec/Rec.csproj --configuration Release

      - name: Build transcription and setup tools
        shell: pwsh
        run: |
          dotnet build transcribe/Transcriptor.Transcription.csproj --configuration Release
          dotnet build setup/Transcriptor.Setup.csproj --configuration Release

      - name: Build desktop applications
        shell: pwsh
        run: |
          dotnet build desktop/Transcriptor.Desktop.csproj --configuration Release
          dotnet build desktop-avalonia/Transcriptor.Desktop.Avalonia.csproj --configuration Release

      - name: Run automated tests
        run: dotnet test transcribe/tests/Transcriptor.Transcription.Tests.csproj --configuration Release

      - name: Publish self-contained desktop application
        run: >-
          dotnet publish desktop/Transcriptor.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package

      - name: Publish self-contained Avalonia desktop application
        run: >-
          dotnet publish desktop-avalonia/Transcriptor.Desktop.Avalonia.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package/avalonia

      - name: Smoke test Avalonia desktop startup
        shell: pwsh
        run: |
          $app = Resolve-Path "artifacts/package/avalonia/Transcriptor.Desktop.Avalonia.exe"
          & $app.Path --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Avalonia desktop startup smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Publish self-contained setup utility
        run: >-
          dotnet publish setup/Transcriptor.Setup.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package/tools/setup

      - name: Publish self-contained recorder CLI
        run: >-
          dotnet publish rec/Rec.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/package/tools/rec

      - name: Generate direct and transitive dependency inventories
        shell: pwsh
        run: |
          $inventory = "artifacts/package/dependency-inventory"
          New-Item -ItemType Directory -Force -Path $inventory | Out-Null

          $projects = @(
            @{ Path = "desktop/Transcriptor.Desktop.csproj"; Name = "desktop" },
            @{ Path = "rec/Rec.csproj"; Name = "recorder" },
            @{ Path = "transcribe/Transcriptor.Transcription.csproj"; Name = "transcription" }
          )
          foreach ($project in $projects) {
            $destination = Join-Path $inventory "$($project.Name).packages.json"
            dotnet list $project.Path package --include-transitive --format json |
              Set-Content -Encoding utf8 $destination
            if ($LASTEXITCODE -ne 0) {
              throw "Could not generate dependency inventory for $($project.Path)"
            }
            Get-Content -Raw $destination | ConvertFrom-Json | Out-Null
          }

          $inventoryFiles = @(Get-ChildItem $inventory -File -Filter "*.packages.json")
          if ($inventoryFiles.Count -ne $projects.Count) {
            throw "Dependency inventory is incomplete."
          }

      - name: Validate package and create archives
        shell: pwsh
        run: |
          Copy-Item README.md artifacts/package/README.md
          Copy-Item SECURITY.md artifacts/package/SECURITY.md
          Copy-Item LICENSE artifacts/package/LICENSE
          Copy-Item THIRD-PARTY-NOTICES.md artifacts/package/THIRD-PARTY-NOTICES.md

          $requiredFiles = @(
            "Transcriptor.Desktop.exe",
            "avalonia/Transcriptor.Desktop.Avalonia.exe",
            "tools/setup/transcriptor-setup.exe",
            "tools/rec/rec.exe",
            "README.md",
            "SECURITY.md",
            "LICENSE",
            "THIRD-PARTY-NOTICES.md"
          )
          foreach ($relativePath in $requiredFiles) {
            $candidate = Join-Path "artifacts/package" $relativePath
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "Required release file is missing: $candidate"
            }
          }

          $packageFiles = @(Get-ChildItem "artifacts/package" -File -Recurse)
          if ($packageFiles.Count -eq 0) {
            throw "The release package is empty."
          }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $archive = "artifacts/Transcriptor-win-x64.zip"
          Compress-Archive -Path "artifacts/package/*" -DestinationPath $archive -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "The standard release archive was not created."
          }
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  Transcriptor-win-x64.zip" | Set-Content -Encoding ascii "artifacts/Transcriptor-win-x64.zip.sha256"

          # Portable variant: all mutable application data remains beside the executable.
          $portable = "artifacts/portable-package"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "artifacts/package/*" $portable -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$portable/data" | Out-Null
          Set-Content -Encoding utf8 "$portable/data/.keep" "Portable data directory"
          Set-Content -Encoding utf8 "$portable/portable.flag" "Transcriptor portable"

          if (-not (Test-Path -LiteralPath "$portable/portable.flag" -PathType Leaf)) {
            throw "The portable marker was not created."
          }
          if (-not (Test-Path -LiteralPath "$portable/data" -PathType Container)) {
            throw "The portable data directory was not created."
          }

          $portableArchive = "artifacts/Transcriptor-win-x64-portable.zip"
          Compress-Archive -Path "$portable/*" -DestinationPath $portableArchive -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $portableArchive -PathType Leaf)) {
            throw "The portable release archive was not created."
          }
          $portableHash = (Get-FileHash -Algorithm SHA256 $portableArchive).Hash.ToLowerInvariant()
          "$portableHash  Transcriptor-win-x64-portable.zip" | Set-Content -Encoding ascii "artifacts/Transcriptor-win-x64-portable.zip.sha256"

          # Inspect ZIP entries and independently verify each SHA-256 sidecar.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          function Test-ReleaseArchive {
            param(
              [Parameter(Mandatory=$true)][string]$ArchivePath,
              [Parameter(Mandatory=$true)][string]$ChecksumPath,
              [Parameter(Mandatory=$true)][string[]]$RequiredEntries
            )

            $actualHash = (Get-FileHash -LiteralPath $ArchivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumLine = (Get-Content -LiteralPath $ChecksumPath -Raw).Trim()
            $checksumParts = $checksumLine -split '  ', 2
            if ($checksumParts.Count -ne 2 -or $checksumParts[0] -notmatch '^[0-9a-fA-F]{64}$') {
              throw "Invalid SHA-256 sidecar format: $ChecksumPath"
            }
            if ($checksumParts[1] -ne [IO.Path]::GetFileName($ArchivePath) -or $checksumParts[0].ToLowerInvariant() -ne $actualHash) {
              throw "SHA-256 sidecar does not match $ArchivePath"
            }

            $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $ArchivePath).Path)
            try {
              $entries = @{}
              foreach ($entry in $zip.Entries) {
                $entries[$entry.FullName.Replace('\', '/')] = $true
              }
              foreach ($required in $RequiredEntries) {
                if (-not $entries.ContainsKey($required)) {
                  throw "Archive $ArchivePath is missing required entry: $required"
                }
              }
            }
            finally {
              $zip.Dispose()
            }
          }

          $commonEntries = @(
            "Transcriptor.Desktop.exe",
            "avalonia/Transcriptor.Desktop.Avalonia.exe",
            "tools/setup/transcriptor-setup.exe",
            "tools/rec/rec.exe",
            "README.md",
            "SECURITY.md",
            "LICENSE",
            "THIRD-PARTY-NOTICES.md",
            "dependency-inventory/desktop.packages.json",
            "dependency-inventory/recorder.packages.json",
            "dependency-inventory/transcription.packages.json"
          )
          Test-ReleaseArchive -ArchivePath $archive -ChecksumPath "artifacts/Transcriptor-win-x64.zip.sha256" -RequiredEntries $commonEntries
          Test-ReleaseArchive -ArchivePath $portableArchive -ChecksumPath "artifacts/Transcriptor-win-x64-portable.zip.sha256" -RequiredEntries ($commonEntries + @("portable.flag", "data/.keep"))

      - name: Upload validation packages (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Transcriptor-windows-validation
          path: |
            artifacts/Transcriptor-win-x64.zip
            artifacts/Transcriptor-win-x64.zip.sha256
            artifacts/Transcriptor-win-x64-portable.zip
            artifacts/Transcriptor-win-x64-portable.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Transcriptor ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/Transcriptor-win-x64.zip
            artifacts/Transcriptor-win-x64.zip.sha256
            artifacts/Transcriptor-win-x64-portable.zip
            artifacts/Transcriptor-win-x64-portable.zip.sha256
