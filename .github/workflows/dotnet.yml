name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-linux:
    name: Portable (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'
      - name: Ensure the production head does not reference the dev head
        run: |
          if grep -Eq 'ProjectReference[^>]*desktop-dev|ProjectReference[^>]*Transcriptor\.Dev' desktop-avalonia/Transcriptor.Desktop.csproj; then
            echo "desktop-avalonia must not reference desktop-dev."
            exit 1
          fi
      - name: Build portable projects (Release)
        run: |
          dotnet build ui/Transcriptor.UI.csproj --configuration Release
          dotnet build transcription/Transcriptor.Transcription.csproj --configuration Release
          dotnet build desktop-dev/Transcriptor.Dev.csproj --configuration Release
      - name: Run portable test suite
        run: dotnet test tests/Transcriptor.Tests/Transcriptor.Tests.csproj --configuration Release
      - name: Dev head smoke test (headless)
        run: dotnet run --project desktop-dev/Transcriptor.Dev.csproj --configuration Release -- --smoke-test

  desktop-windows:
    name: Windows (full)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'
      - name: Build all projects (Release)
        shell: pwsh
        run: |
          dotnet build ui/Transcriptor.UI.csproj --configuration Release
          dotnet build transcription/Transcriptor.Transcription.csproj --configuration Release
          dotnet build platform-windows/Transcriptor.Platform.Windows.csproj --configuration Release
          dotnet build rec/Rec.csproj --configuration Release
          dotnet build setup/Transcriptor.Setup.csproj --configuration Release
          dotnet build desktop-avalonia/Transcriptor.Desktop.csproj --configuration Release
          dotnet build desktop-dev/Transcriptor.Dev.csproj --configuration Release
      - name: Run portable test suite
        run: dotnet test tests/Transcriptor.Tests/Transcriptor.Tests.csproj --configuration Release
      - name: Run Windows-only test suite
        run: dotnet test tests/Transcriptor.Tests.Windows/Transcriptor.Tests.Windows.csproj --configuration Release
